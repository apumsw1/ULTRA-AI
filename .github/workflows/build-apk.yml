name: Build ULTRA AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK Licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Materialize debug.keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Restore google-services.json if provided via Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON secret not set; continuing with MissingGoogleServicesStrategy.WARN"
          fi

      - name: Cache Robolectric Android 16 SDK Jar
        id: cache-robolectric
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7
          key: robolectric-16-robolectric-13921718-i7

      - name: Download Robolectric Android 16 SDK Jar
        if: steps.cache-robolectric.outputs.cache-hit != 'true'
        run: |
          DEST="$HOME/.m2/repository/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7"
          mkdir -p "$DEST"
          JAR="android-all-instrumented-16-robolectric-13921718-i7.jar"
          POM="android-all-instrumented-16-robolectric-13921718-i7.pom"
          BASE_PATH="org/robolectric/android-all-instrumented/16-robolectric-13921718-i7"
          if [ ! -s "$DEST/$JAR" ]; then
            curl -fSL --retry 5 --retry-delay 3 --retry-all-errors -A "Mozilla/5.0" \
              "https://repo1.maven.org/maven2/$BASE_PATH/$JAR" -o "$DEST/$JAR" \
              || curl -fSL --retry 5 --retry-delay 3 --retry-all-errors -A "Mozilla/5.0" \
              "https://maven-central.storage-download.googleapis.com/maven2/$BASE_PATH/$JAR" -o "$DEST/$JAR"
          fi
          if [ ! -s "$DEST/$POM" ]; then
            curl -fSL --retry 3 --retry-delay 2 -A "Mozilla/5.0" \
              "https://repo1.maven.org/maven2/$BASE_PATH/$POM" -o "$DEST/$POM" \
              || curl -fSL --retry 3 --retry-delay 2 -A "Mozilla/5.0" \
              "https://maven-central.storage-download.googleapis.com/maven2/$BASE_PATH/$POM" -o "$DEST/$POM" || true
          fi

      - name: Run Unit Tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace --console=plain

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ULTRA-AI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
