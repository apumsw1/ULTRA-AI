name = "ultra-ai-voice"
main = "src/index.js"
compatibility_date = "2026-11-18"
workers_dev = true

[vars]
DEFAULT_PROVIDER = "auto"
OPENAI_MODEL = "gpt-4o-mini"
GEMINI_MODEL = "gemini-2.5-flash"
RATE_LIMIT_PER_MIN = "30"

# Cloudflare D1 SQLite database binding (Free Plan compatible)
# Create with: npx wrangler d1 create ultra_ai_db
# Migrate with: npx wrangler d1 migrations apply ultra_ai_db --remote
[[d1_databases]]
binding = "DB"
database_name = "ultra_ai_db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Cloudflare KV namespace binding for per-IP rate limiting (Free Plan compatible)
# Create with: npx wrangler kv namespace create ULTRA_KV
[[kv_namespaces]]
binding = "ULTRA_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Configure encrypted secrets before deploying (never commit keys here):
# npx wrangler secret put GEMINI_API_KEY
# npx wrangler secret put OPENAI_API_KEY
# npx wrangler secret put ULTRA_AUTH_TOKEN
