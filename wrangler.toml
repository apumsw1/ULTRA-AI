name = "ultra-ai-voice"
main = "src/index.js"
compatibility_date = "2026-11-18"
workers_dev = true

[vars]
DEFAULT_PROVIDER = "auto"
OPENAI_MODEL = "gpt-4o-mini"
GEMINI_MODEL = "gemini-3.8-flash"
CF_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
RATE_LIMIT_PER_MIN = "45"

# Cloudflare Workers AI binding (Free Plan compatible — runs Llama/Mistral on Cloudflare edge without external API keys)
[ai]
binding = "AI"

# Cloudflare D1 SQLite database binding (Free Plan compatible)
# Create with: npx wrangler d1 create ultra_ai_db
# Migrate with: npx wrangler d1 migrations apply ultra_ai_db --remote
[[d1_databases]]
binding = "DB"
database_name = "ultra_ai_db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Cloudflare KV namespace binding for per-IP rate limiting (Free Plan compatible)
# Create with: npx wrangler kv namespace create ULTRA_KV
[[kv_namespaces]]
binding = "ULTRA_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Optional encrypted provider secrets (never commit keys here):
# npx wrangler secret put GEMINI_API_KEY
# npx wrangler secret put OPENAI_API_KEY
# npx wrangler secret put ULTRA_AUTH_TOKEN
